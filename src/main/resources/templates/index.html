<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>index Page</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
		
		<div class="container mt-5">
			<h1>My Blog Post</h1>
			<a href="/add" class="btn btn-primary mb-3">Add New Post</a>
			
			<div class="row row-cols-1 row-cols-md-2 g-4">
				<div class="col" th:each="post:${posts}">
					<div class="card h-100">
						<div class="card-body">
							<h5 class="card-title" th:text="${post.title}">Post Title</h5>
							<p class="cart-text" th:text="${post.content}">Post content...</p>
						</div>
						
						<div class="card-footer text-muted d-flex justify-content-between">
							<span th:text="${post.createdAt}" >Date</span>
							<a class="btn btn-outline-secondary" th:href="@{'/edit/' + ${post.id}}">Edit</a>
							<a class="btn btn-outline-danger" th:href="@{'/delete/' + ${post.id}}">Delete</a>
						</div>
					</div>
				</div>
			</div>
		</div>
		
</body>
</html>
