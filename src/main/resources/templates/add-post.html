<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>add post</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
		<div class="container mt-5">
		<h2>Add New Post</h2>
			<form th:action="@{/add}" th:object="${post}" method="post">
			<div class="mt-3">
				<label class="form-label">Title</label>
				<input type="text" th:field=*{title} class="form-control" placehoder="Enter title" required>
			</div>
			
			<div class="mt-3">
				<label class="form-label">Content</label>
				<textarea type="text" th:field=*{content} class="form-control" placehoder="Enter content" required></textarea>
			</div>
				<button type="sumbit" class="btn btn-success">Save Post</button>
				<a href="/" class="btn btn-secondary">Canel</a>
			</form>
			
			
		</div>
</body>
</html>
